# ============================================================================
# API GATEWAY — INTÉGRATION CONTINUE
# ============================================================================
#
# ⚠️ LA RACINE GIT N'EST PAS LA RACINE DU CODE.
#
# Ce dépôt a une structure inhabituelle : la racine Git est `api-gateway/`, et
# le code (avec son `package.json`) vit dans `api-gateway/api-gateway/`. Chaque
# étape doit donc déclarer `working-directory`, et le cache npm doit pointer
# vers le bon lockfile — sans quoi `npm ci` échoue avec un message qui ne dit
# rien d'utile.
#
# ⚠️ `npm test` DOIT garder son glob : `node --test "test/**/*.test.js"`.
# `node --test test/` résout `test/` comme un module CommonJS et échoue en
# `MODULE_NOT_FOUND` sur Node 22. Le défaut a déjà existé dans ce dépôt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Chaque lundi, même sans poussée : une faille publiée dans la semaine se
  # voit tout de suite (2026-11-11). Et à la main depuis l'onglet Actions.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: api-gateway

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Ce dépôt ne déclare AUCUN `engines` — c'est une dette à combler
          # (voir l'audit, §32). En attendant, 22.x est la version des postes
          # de développement et celle sur laquelle les 120 tests sont verts.
          node-version: "22.x"
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test

  audit:
    name: Vulnérabilités
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: api-gateway/package-lock.json

      - run: npm ci

      # ─────────────────────────────────────────────────────────────────────
      # FAILLES DES DÉPENDANCES — UNE RÈGLE, LES CINQ DÉPÔTS (2026-11-11).
      # `scripts/audit-gate.cjs` (identique à l'octet près partout) : critique
      # ou haute ⇒ bloque ; moyenne dans le code livré ⇒ bloque ; le reste est
      # signalé. Exceptions nommées, justifiées, compensées et datées (180 jours
      # au plus) dans `audit-exceptions.json`. `npm audit` muet ⇒ échec.
      # Remplace les seuils d'avant, différents par dépôt (une faille critique
      # de Mongoose était passée sous « critical » / « high »).
      # ─────────────────────────────────────────────────────────────────────
      - name: "Failles des dépendances (règle commune PayNoval)"
        run: node scripts/audit-gate.cjs
